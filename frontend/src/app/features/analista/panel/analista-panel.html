<div class="container py-4 animar-entrada">
  <h1><app-icon nombre="inicio" [size]="26" [strokeWidth]="1.6" />Panel de analista</h1>
  <p class="text-secondary">Comprobaciones y estadísticas del proceso electoral.</p>

  <div class="row row-cols-1 row-cols-md-2 g-3 mt-2">
    <div class="col">
      <a
        routerLink="/analista/partidos/comprobar"
        class="enlace-panel card card-body flex-row align-items-center gap-3 h-100"
      >
        <span class="icono-enlace"><app-icon nombre="comprobar" /></span>
        <span class="fw-semibold">Comprobar partidos</span>
      </a>
    </div>
    <div class="col">
      <a
        routerLink="/analista/candidatos"
        class="enlace-panel card card-body flex-row align-items-center gap-3 h-100"
      >
        <span class="icono-enlace"><app-icon nombre="candidatos" /></span>
        <span class="fw-semibold">Candidatos por localidad</span>
      </a>
    </div>
    <div class="col">
      <a
        routerLink="/analista/porcentajes"
        class="enlace-panel card card-body flex-row align-items-center gap-3 h-100"
      >
        <span class="icono-enlace"><app-icon nombre="porcentajes" /></span>
        <span class="fw-semibold">Participación</span>
      </a>
    </div>
    <div class="col">
      <a
        routerLink="/analista/cookie"
        class="enlace-panel card card-body flex-row align-items-center gap-3 h-100"
      >
        <span class="icono-enlace"><app-icon nombre="cookie" /></span>
        <span class="fw-semibold">Cookie del ganador</span>
      </a>
    </div>
  </div>
</div>

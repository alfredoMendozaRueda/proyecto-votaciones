  <div class="enlaces-panel">
    <a routerLink="/analista/partidos/comprobar">
      <span class="icono-enlace"><app-icon nombre="comprobar" /></span>

    <a routerLink="/analista/candidatos">

    <a routerLink="/analista/porcentajes">

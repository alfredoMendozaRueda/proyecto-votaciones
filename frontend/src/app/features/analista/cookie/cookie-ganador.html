<div class="container">
  <h1><app-icon nombre="cookie" [size]="26" [strokeWidth]="1.6" />Cookie del partido ganador</h1>

  @if (error()) {
    <app-alert tipo="error" [mensaje]="error()!" />
  }
  @if (mensajeExito()) {
    <app-alert tipo="exito" [mensaje]="mensajeExito()!" />
  }

  <div class="tarjeta tarjeta-centrada">
    <span class="insignia-circular"><app-icon nombre="cookie" [size]="26" [strokeWidth]="1.6" /></span>
    <p>
      @if (consultando()) {
        <span class="skeleton skeleton-linea" style="width: 10rem; display: inline-block;"></span>
      } @else if (partidoGanador()) {
        Cookie actual: <strong>{{ partidoGanador() }}</strong>
      } @else {
        <span class="texto-muted">No hay ninguna cookie guardada.</span>
      }
    </p>
    <div class="acciones">
      <button type="button" (click)="crear()" [disabled]="creando()">
        @if (creando()) {
          <span class="spinner"></span>
        } @else {
          <app-icon nombre="cookie" [size]="16" />
        }
        Crear cookie con el ganador
      </button>
      <button type="button" class="boton-secundario" (click)="consultar()" [disabled]="consultando()">
        @if (consultando()) {
          <span class="spinner"></span>
        } @else {
          <app-icon nombre="refrescar" [size]="16" />
        }
        Actualizar
      </button>
    </div>
    <p class="texto-muted">Solo puede crearse cuando las elecciones están inhabilitadas.</p>
  </div>
</div>

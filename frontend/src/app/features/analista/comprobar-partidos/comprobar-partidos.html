<div class="container py-4 animar-entrada">
  <h1><app-icon nombre="comprobar" [size]="26" [strokeWidth]="1.6" />Comprobar partidos políticos</h1>

  @if (error()) {
    <app-alert tipo="error" [mensaje]="error()!" />
  }

  @if (cargando()) {
    <div class="d-flex align-items-center justify-content-center gap-3 text-secondary py-5">
      <span class="spinner-border" aria-hidden="true"></span> Comprobando partidos...
    </div>
  } @else if (partidos()) {
    <app-alert tipo="exito" mensaje="Hay suficientes partidos políticos dados de alta." />
    <div class="table-responsive card shadow-sm">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Siglas</th>
            <th>Descripción</th>
          </tr>
        </thead>
        <tbody>
          @for (partido of partidos(); track partido.siglas) {
            <tr>
              <td>{{ partido.siglas }}</td>
              <td>{{ partido.descripcion }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>

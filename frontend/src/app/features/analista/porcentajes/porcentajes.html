<div class="container-ancho">
  <h1><app-icon nombre="porcentajes" [size]="26" [strokeWidth]="1.6" />Participación por localidad</h1>

  @if (error()) {
    <app-alert tipo="error" [mensaje]="error()!" />
  }
  @if (mensajeExito()) {
    <app-alert tipo="exito" [mensaje]="mensajeExito()!" />
  }

  <div class="acciones">
    <button type="button" (click)="recalcular()" [disabled]="recalculando()">
      <app-icon nombre="refrescar" [size]="16" /> Recalcular participación
    </button>
  </div>

  <div class="tabla-responsive">
    <table>
      <thead>
        <tr>
          <th>Localidad</th>
          <th>Participación</th>
        </tr>
      </thead>
      <tbody>
        @for (fila of porcentajes(); track fila.localidad) {
          <tr>
            <td>{{ fila.localidad }}</td>
            <td class="celda-barra">
              <div class="barra-resultado" [style.--porcentaje.%]="fila.porcentaje">
                <span></span>
              </div>
              <span class="texto-muted">{{ fila.porcentaje | number: '1.0-2' }}%</span>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2" class="texto-muted">No hay datos de participación todavía.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<div class="container-ancho">
  <h1><app-icon nombre="elecciones" [size]="26" [strokeWidth]="1.6" />Elecciones</h1>

  @if (error()) {
    <app-alert tipo="error" [mensaje]="error()!" />
  }
  @if (mensajeExito()) {
    <app-alert tipo="exito" [mensaje]="mensajeExito()!" />
  }

  <h2>Nueva elección</h2>
  <form class="tarjeta" (ngSubmit)="crear()">
    <label>
      Identificador
      <input type="text" name="idElecciones" [(ngModel)]="idElecciones" required />
    </label>
    <label>
      Descripción
      <input type="text" name="descripcion" [(ngModel)]="descripcion" required />
    </label>
    <label>
      Fecha de fin
      <input type="date" name="fechaFin" [(ngModel)]="fechaFin" required />
    </label>
    <button type="submit" [disabled]="enviando()">
      @if (enviando()) {
        <span class="spinner"></span>
      } @else {
        <app-icon nombre="elecciones" [size]="16" />
      }
      Crear elección
    </button>
  </form>

  <hr class="separador" />

  <h2>Gestionar elección existente</h2>
  <div class="tarjeta">
    <label>
      Identificador de la elección
      <input type="text" name="idGestion" [(ngModel)]="idGestion" required />
    </label>
    <div class="acciones">
      <button type="button" [disabled]="!!procesando()" (click)="habilitar()">
        @if (procesando() === 'habilitar') {
          <span class="spinner"></span>
        } @else {
          <app-icon nombre="exito" [size]="16" />
        }
        Habilitar
      </button>
      <button type="button" class="boton-secundario" [disabled]="!!procesando()" (click)="deshabilitar()">
        @if (procesando() === 'deshabilitar') {
          <span class="spinner"></span>
        } @else {
          <app-icon nombre="error" [size]="16" />
        }
        Deshabilitar
      </button>
      <button type="button" class="boton-peligro" [disabled]="!!procesando()" (click)="eliminar()">
        @if (procesando() === 'eliminar') {
          <span class="spinner"></span>
        } @else {
          <app-icon nombre="papelera" [size]="16" />
        }
        Eliminar
      </button>
    </div>
  </div>
</div>

<div class="container-ancho">
  <h1><app-icon nombre="partidos" [size]="26" [strokeWidth]="1.6" />Partidos políticos</h1>

  @if (error()) {
    <app-alert tipo="error" [mensaje]="error()!" />
  }
  @if (mensajeExito()) {
    <app-alert tipo="exito" [mensaje]="mensajeExito()!" />
  }

  <form class="tarjeta" (ngSubmit)="crear()">
    <label>
      Siglas
      <input type="text" name="siglas" [(ngModel)]="siglas" required />
    </label>
    <label>
      Descripción
      <input type="text" name="descripcion" [(ngModel)]="descripcion" required />
    </label>
    <label>
      Nombre del archivo de imagen
      <input type="text" name="imagen" [(ngModel)]="imagen" placeholder="PARTIDO.jpg" required />
    </label>
    <button type="submit" [disabled]="enviando()">
      <app-icon nombre="partidos" [size]="16" /> Registrar partido
    </button>
  </form>

  <hr class="separador" />

  <div class="tabla-responsive">
    <table>
      <thead>
        <tr>
          <th>Logo</th>
          <th>Siglas</th>
          <th>Descripción</th>
        </tr>
      </thead>
      <tbody>
        @for (partido of partidos(); track partido.siglas) {
          <tr>
            <td><img class="miniatura-partido" [src]="partido.imagen" [alt]="partido.descripcion" /></td>
            <td>{{ partido.siglas }}</td>
            <td>{{ partido.descripcion }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="texto-muted">Todavía no hay partidos registrados.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<div class="container py-4 animar-entrada">
  <h1><app-icon nombre="inicio" [size]="26" [strokeWidth]="1.6" />Panel de administración</h1>
  <p class="text-secondary">Gestiona el proceso electoral completo.</p>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mt-2">
    <div class="col">
      <a routerLink="/admin/partidos" class="enlace-panel card card-body flex-row align-items-center gap-3 h-100">
        <span class="icono-enlace"><app-icon nombre="partidos" /></span>
        <span class="fw-semibold">Partidos políticos</span>
      </a>
    </div>
    <div class="col">
      <a routerLink="/admin/candidatos" class="enlace-panel card card-body flex-row align-items-center gap-3 h-100">
        <span class="icono-enlace"><app-icon nombre="candidatos" /></span>
        <span class="fw-semibold">Candidatos</span>
      </a>
    </div>
    <div class="col">
      <a routerLink="/admin/elecciones" class="enlace-panel card card-body flex-row align-items-center gap-3 h-100">
        <span class="icono-enlace"><app-icon nombre="elecciones" /></span>
        <span class="fw-semibold">Elecciones</span>
      </a>
    </div>
    <div class="col">
      <a routerLink="/admin/censo" class="enlace-panel card card-body flex-row align-items-center gap-3 h-100">
        <span class="icono-enlace"><app-icon nombre="censo" /></span>
        <span class="fw-semibold">Censo electoral</span>
      </a>
    </div>
    <div class="col">
      <a routerLink="/votacion" class="enlace-panel card card-body flex-row align-items-center gap-3 h-100">
        <span class="icono-enlace"><app-icon nombre="votar" /></span>
        <span class="fw-semibold">Votar</span>
      </a>
    </div>
    <div class="col">
      <a routerLink="/resultados" class="enlace-panel card card-body flex-row align-items-center gap-3 h-100">
        <span class="icono-enlace"><app-icon nombre="resultados" /></span>
        <span class="fw-semibold">Resultados</span>
      </a>
    </div>
  </div>
</div>

# Compila el instalador de Windows y lo deja en la página de descargas
# (Releases) del repositorio, siempre con la última versión de esta rama.
name: Kitsune para Windows

on:
  push:
    branches: [kitsune-asistente]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kitsune-windows
  cancel-in-progress: true

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Proyecto de Google de Kitsune (Settings → Secrets and variables → Actions).
      - run: node scripts/google.mjs
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      # Dirección del servidor de avisos (la guarda el flujo «Kitsune servidor»).
      - run: node scripts/nube.mjs
        env:
          KITSUNE_SERVIDOR: ${{ vars.KITSUNE_SERVIDOR }}
      - run: npm run dist -- --publish never
        env:
          # Sin certificado de firma: el instalador se genera sin firmar.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Probar el instalador (instala, arranca y sigue abierto)
        shell: pwsh
        run: |
          $instalador = Get-ChildItem out -Filter 'Kitsune Setup*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $instalador.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'Kitsune.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'El instalador no dejó Kitsune.exe instalado.' }
          Write-Host "Instalado en $($exe.FullName)"
          $proceso = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($proceso.HasExited) { throw "Kitsune se cerró al arrancar (código $($proceso.ExitCode))." }
          Write-Host 'Kitsune sigue abierto tras 20 s.'
          Get-Process -Name Kitsune -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Publicar el instalador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          instalador=$(ls out/Kitsune\ Setup*.exe | head -n 1)
          cp "$instalador" out/Kitsune-Setup.exe
          # Una sola descarga, siempre la más reciente: se rehace en cada cambio.
          gh release delete kitsune-windows --cleanup-tag --yes || true
          gh release create kitsune-windows out/Kitsune-Setup.exe \
            --target "$GITHUB_SHA" \
            --title "Kitsune para Windows" \
            --notes "Instalador de Kitsune para Windows 10 y 11 (64 bits), compilado a partir de la rama kitsune-asistente.

          1. Descarga **Kitsune-Setup.exe** (abajo, en Assets).
          2. Ábrelo. Como el instalador no está firmado, Windows puede mostrar «Windows protegió tu PC»: pulsa **Más información** y luego **Ejecutar de todas formas**.
          3. Sigue el asistente. Al terminar, pulsa **Ctrl + Alt + K** para llamar al zorro.

          Compilación: ${GITHUB_SHA::7}"

# Publica la versión web (PWA) de Kitsune en GitHub Pages.
name: Kitsune web

on:
  push:
    branches: [kitsune-asistente]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kitsune-pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      # La web no necesita el binario de Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Proyecto de Google de Kitsune (Settings → Secrets and variables → Actions).
      # La web solo necesita el ID público del cliente web.
      - run: node scripts/google.mjs
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

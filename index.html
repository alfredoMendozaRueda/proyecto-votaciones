<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net https://api.anthropic.com https://api.groq.com https://api.openai.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://gmail.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/ https://*.workers.dev ws://localhost:*; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Kitsune</title>
    <meta name="description" content="Tu asistente kitsune: habla con Claude y revisa tu Gmail." />
    <meta name="theme-color" content="#0d0909" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kitsune" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./iconos/favicon-32.png" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/app/app.css" />
    <link rel="stylesheet" href="/src/app/diseno.css" />
  </head>
  <body>
    <div class="escena" id="escena" data-tamano="mediano" data-posicion="izquierda">
      <section class="dialogo" id="dialogo" aria-label="Kitsune" hidden>
        <header class="dialogo__cabecera">
          <div class="marca">
            <span class="marca__sello" lang="ja" aria-hidden="true">狐</span>
            <span class="marca__nombre">Hoy</span>
          </div>
          <!-- Solo en el Chat: sus conversaciones, lo que Kitsune sabe de ti y empezar otra. -->
          <button type="button" class="icono-boton solo-chat" id="boton-historial" aria-label="Conversaciones" title="Conversaciones" aria-pressed="false" hidden></button>
          <button type="button" class="icono-boton solo-chat" id="boton-memoria" aria-label="Lo que sé de ti" title="Lo que sé de ti" aria-pressed="false" hidden></button>
          <button type="button" class="icono-boton solo-chat" id="boton-nueva" aria-label="Nueva conversación" title="Nueva conversación" hidden></button>
          <button type="button" class="icono-boton" id="boton-buscar" aria-label="Buscar en Kitsune" title="Buscar (Ctrl+K)" aria-keyshortcuts="Control+K"></button>
          <button type="button" class="icono-boton" id="boton-ajustes" aria-label="Ajustes" title="Ajustes"></button>
          <button type="button" class="icono-boton" id="boton-cerrar" aria-label="Cerrar el diálogo" title="Cerrar"></button>
        </header>
        <nav class="apartados" role="tablist" aria-label="Apartados">
          <button type="button" role="tab" id="pestana-hoy" data-vista="hoy" aria-selected="true" aria-controls="vista-hoy" title="Hoy"><span class="apartado__icono" data-icono="cuadricula"></span><span class="apartado__nombre">Hoy</span></button>
          <button type="button" role="tab" id="pestana-chat" data-vista="chat" aria-selected="false" aria-controls="vista-chat" title="Chat"><span class="apartado__icono" data-icono="chat"></span><span class="apartado__nombre">Chat</span></button>
          <button type="button" role="tab" id="pestana-correo" data-vista="correo" aria-selected="false" aria-controls="vista-correo" title="Correo"><span class="apartado__icono" data-icono="sobre"></span><span class="apartado__nombre">Correo</span><span class="insignia" id="insignia-correo" hidden></span></button>
          <button type="button" role="tab" id="pestana-agenda" data-vista="agenda" aria-selected="false" aria-controls="vista-agenda" title="Agenda"><span class="apartado__icono" data-icono="calendario"></span><span class="apartado__nombre">Agenda</span><span class="insignia" id="insignia-agenda" hidden></span></button>
          <button type="button" id="pestana-mas" aria-haspopup="dialog" aria-expanded="false" aria-controls="hoja-mas" title="Más apartados"><span class="apartado__icono" data-icono="mas"></span><span class="apartado__nombre">Más</span><span class="insignia" id="insignia-empleo" hidden></span></button>
        </nav>
        <!-- Hablar con Kitsune: siempre a mano, al lado de la barra. -->
        <button type="button" class="boton-voz" id="boton-voz" aria-label="Hablar con Kitsune" title="Hablar con Kitsune"><span class="apartado__icono" data-icono="ondas"></span></button>
        <!-- Más: el resto de apartados, en una hoja que sube desde abajo. -->
        <div class="hoja-mas" id="hoja-mas" role="dialog" aria-modal="true" aria-label="Más apartados" hidden>
          <div class="hoja-mas__fondo" data-cerrar-mas></div>
          <div class="hoja-mas__panel">
            <span class="hoja-mas__asa" aria-hidden="true"></span>
            <p class="hoja-mas__titulo">Más</p>
            <div class="hoja-mas__rejilla">
              <button type="button" class="hoja-mas__item" id="pestana-empleo" data-vista="empleo"><span class="apartado__icono" data-icono="maletin"></span><span class="apartado__nombre">Empleo</span><span class="hoja-mas__cuenta" id="cuenta-empleo" hidden></span></button>
              <button type="button" class="hoja-mas__item" id="pestana-gastos" data-vista="gastos"><span class="apartado__icono" data-icono="cartera"></span><span class="apartado__nombre">Gastos</span></button>
              <button type="button" class="hoja-mas__item" id="pestana-biblia" data-vista="biblia"><span class="apartado__icono" data-icono="libro"></span><span class="apartado__nombre">Biblia</span></button>
              <button type="button" class="hoja-mas__item" data-ir-mas="recordatorios"><span class="apartado__icono" data-icono="campana"></span><span class="apartado__nombre">Avisos</span></button>
              <button type="button" class="hoja-mas__item" data-ir-mas="historial"><span class="apartado__icono" data-icono="historial"></span><span class="apartado__nombre">Conversaciones</span></button>
              <button type="button" class="hoja-mas__item" data-ir-mas="memoria"><span class="apartado__icono" data-icono="memoria"></span><span class="apartado__nombre">Lo que sé de ti</span></button>
              <button type="button" class="hoja-mas__item" data-ir-mas="buscar"><span class="apartado__icono" data-icono="buscar"></span><span class="apartado__nombre">Buscar</span></button>
              <button type="button" class="hoja-mas__item" data-ir-mas="ajustes"><span class="apartado__icono" data-icono="ajustes"></span><span class="apartado__nombre">Ajustes</span></button>
            </div>
          </div>
        </div>
        <!-- Agenda: el calendario y los avisos (recordatorios, automatizaciones y actividad). -->
        <div class="subapartados" id="sub-agenda" role="tablist" aria-label="Agenda" hidden>
          <button type="button" role="tab" data-vista="agenda" aria-selected="true">Calendario</button>
          <button type="button" role="tab" data-vista="recordatorios" aria-selected="false" title="Recordatorios, automatizaciones y actividad">Avisos<span class="insignia" id="insignia-recordatorios" hidden></span></button>
        </div>
        <div class="dialogo__cuerpo">
          <section class="vista" id="vista-hoy" role="tabpanel" aria-labelledby="pestana-hoy"></section>
          <section class="vista" id="vista-chat" role="tabpanel" aria-labelledby="pestana-chat" hidden></section>
          <section class="vista" id="vista-correo" role="tabpanel" aria-labelledby="pestana-correo" hidden></section>
          <section class="vista" id="vista-agenda" role="tabpanel" aria-labelledby="pestana-agenda" hidden></section>
          <section class="vista" id="vista-recordatorios" aria-label="Avisos" hidden></section>
          <section class="vista" id="vista-memoria" aria-label="Lo que sé de ti" hidden></section>
          <section class="vista" id="vista-historial" aria-label="Conversaciones" hidden></section>
          <section class="vista" id="vista-empleo" role="tabpanel" aria-labelledby="pestana-empleo" hidden></section>
          <section class="vista" id="vista-gastos" role="tabpanel" aria-labelledby="pestana-gastos" hidden></section>
          <section class="vista" id="vista-biblia" role="tabpanel" aria-labelledby="pestana-biblia" hidden></section>
          <section class="vista" id="vista-ajustes" aria-label="Ajustes" hidden></section>
        </div>
      </section>
      <div class="zorro" id="zorro"></div>
    </div>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>

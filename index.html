<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Kitsune</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/src/app/app.css" />
  </head>
  <body>
    <div class="escena" id="escena" data-tamano="mediano" data-posicion="izquierda">
      <section class="dialogo" id="dialogo" aria-label="Kitsune" hidden>
        <header class="dialogo__cabecera">
          <div class="marca">
            <span class="marca__sello" lang="ja" aria-hidden="true">狐</span>
            <span class="marca__nombre">Kitsune</span>
          </div>
          <div class="pestanas" role="tablist" aria-label="Secciones">
            <button type="button" role="tab" id="pestana-chat" aria-selected="true" aria-controls="vista-chat">Chat</button>
            <button type="button" role="tab" id="pestana-correo" aria-selected="false" aria-controls="vista-correo">
              Correo <span class="insignia" id="insignia-correo" hidden></span>
            </button>
          </div>
          <button type="button" class="icono-boton" id="boton-ajustes" aria-label="Ajustes" title="Ajustes"></button>
          <button type="button" class="icono-boton" id="boton-cerrar" aria-label="Cerrar el diálogo" title="Cerrar"></button>
        </header>
        <div class="dialogo__cuerpo">
          <section class="vista" id="vista-chat" role="tabpanel" aria-labelledby="pestana-chat"></section>
          <section class="vista" id="vista-correo" role="tabpanel" aria-labelledby="pestana-correo" hidden></section>
          <section class="vista" id="vista-ajustes" aria-label="Ajustes" hidden></section>
        </div>
      </section>
      <div class="zorro" id="zorro"></div>
    </div>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>

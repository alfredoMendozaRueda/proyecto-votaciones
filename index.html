<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net https://api.anthropic.com https://api.groq.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://gmail.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/ https://*.workers.dev ws://localhost:*; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Kitsune</title>
    <meta name="description" content="Tu asistente kitsune: habla con Claude y revisa tu Gmail." />
    <meta name="theme-color" content="#0d0909" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kitsune" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./iconos/favicon-32.png" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/app/app.css" />
  </head>
  <body>
    <div class="escena" id="escena" data-tamano="mediano" data-posicion="izquierda">
      <section class="dialogo" id="dialogo" aria-label="Kitsune" hidden>
        <header class="dialogo__cabecera">
          <div class="marca">
            <span class="marca__sello" lang="ja" aria-hidden="true">狐</span>
            <span class="marca__nombre">Kitsune</span>
          </div>
          <button type="button" class="icono-boton solo-movil" id="boton-nueva" aria-label="Nueva conversación" title="Nueva conversación"></button>
          <button type="button" class="icono-boton" id="boton-ajustes" aria-label="Ajustes" title="Ajustes"></button>
          <button type="button" class="icono-boton" id="boton-cerrar" aria-label="Cerrar el diálogo" title="Cerrar"></button>
        </header>
        <nav class="apartados" role="tablist" aria-label="Apartados">
          <button type="button" role="tab" id="pestana-chat" data-vista="chat" aria-selected="true" aria-controls="vista-chat" title="Chat"><span class="apartado__icono" data-icono="chat"></span><span class="apartado__nombre">Chat</span></button>
          <button type="button" role="tab" id="pestana-correo" data-vista="correo" aria-selected="false" aria-controls="vista-correo" title="Correo"><span class="apartado__icono" data-icono="sobre"></span><span class="apartado__nombre">Correo</span><span class="insignia" id="insignia-correo" hidden></span></button>
          <button type="button" role="tab" id="pestana-agenda" data-vista="agenda" aria-selected="false" aria-controls="vista-agenda" title="Agenda"><span class="apartado__icono" data-icono="calendario"></span><span class="apartado__nombre">Agenda</span></button>
          <button type="button" role="tab" id="pestana-recordatorios" data-vista="recordatorios" aria-selected="false" aria-controls="vista-recordatorios" title="Recordatorios" aria-label="Recordatorios"><span class="apartado__icono" data-icono="campana"></span><span class="apartado__nombre" data-corto="Avisos">Recordatorios</span><span class="insignia" id="insignia-recordatorios" hidden></span></button>
          <button type="button" role="tab" id="pestana-memoria" data-vista="memoria" aria-selected="false" aria-controls="vista-memoria" title="Memoria"><span class="apartado__icono" data-icono="memoria"></span><span class="apartado__nombre">Memoria</span></button>
          <button type="button" role="tab" id="pestana-historial" data-vista="historial" aria-selected="false" aria-controls="vista-historial" title="Historial"><span class="apartado__icono" data-icono="historial"></span><span class="apartado__nombre">Historial</span></button>
          <button type="button" class="solo-movil" id="pestana-mas" aria-haspopup="dialog" aria-expanded="false" aria-controls="hoja-mas" title="Más"><span class="apartado__icono"></span><span class="apartado__nombre">Más</span></button>
        </nav>
        <div class="dialogo__cuerpo">
          <section class="vista" id="vista-chat" role="tabpanel" aria-labelledby="pestana-chat"></section>
          <section class="vista" id="vista-correo" role="tabpanel" aria-labelledby="pestana-correo" hidden></section>
          <section class="vista" id="vista-agenda" role="tabpanel" aria-labelledby="pestana-agenda" hidden></section>
          <section class="vista" id="vista-recordatorios" role="tabpanel" aria-labelledby="pestana-recordatorios" hidden></section>
          <section class="vista" id="vista-memoria" role="tabpanel" aria-labelledby="pestana-memoria" hidden></section>
          <section class="vista" id="vista-historial" role="tabpanel" aria-labelledby="pestana-historial" hidden></section>
          <section class="vista" id="vista-ajustes" aria-label="Ajustes" hidden></section>
        </div>
      </section>
      <div class="zorro" id="zorro"></div>
    </div>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>

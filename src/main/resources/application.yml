spring:
  application:
    name: proyecto-votaciones

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bbdd_amr_elecciones?useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USUARIO:root}
    password: ${DB_CONTRASENA:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  # La mayoria de plataformas de hosting (Render, Railway...) inyectan su
  # propio puerto en la variable PORT; si no existe, se usa SERVER_PORT o,
  # en su defecto, 8080 para desarrollo local.
  port: ${PORT:${SERVER_PORT:8080}}

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidatos por localidad - Sistema de Votaciones</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/barra :: barraSuperior}"></div>
    <div class="container">
        <h1>Candidatos por localidad</h1>
        <form th:action="@{/analista/candidatos/resultado}">
            <label for="localidad">Localidad</label>
            <select id="localidad" name="localidad">
                <option th:each="localidad : ${localidades}" th:value="${localidad}" th:text="${localidad}">Localidad</option>
            </select>
            <input type="submit" value="Ver">
        </form>
        <hr class="separador">
        <form th:action="@{/analista/panel}">
            <input type="submit" value="Volver al panel">
        </form>
    </div>
</body>
</html>

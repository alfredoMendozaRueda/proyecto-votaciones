<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Porcentaje de participación - Sistema de Votaciones</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/barra :: barraSuperior}"></div>
    <div class="container-ancho">
        <h1>Porcentaje de participación</h1>
        <div class="tabla-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Localidad</th>
                        <th>Participación</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entrada : ${porcentajes}">
                        <td th:text="${entrada.key}">Localidad</td>
                        <td th:text="${#numbers.formatDecimal(entrada.value, 1, 2)} + '%'">0%</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <form th:action="@{/analista/panel}">
            <input type="submit" value="Volver al panel">
        </form>
    </div>
</body>
</html>

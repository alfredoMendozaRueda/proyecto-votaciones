<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Presidente ganador - Sistema de Votaciones</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/barra :: barraSuperior}"></div>
    <div class="container">
        <h1>Presidente ganador</h1>

        <p th:if="${eleccionesTodaviaHabilitadas}" class="error">
            Las elecciones todavía están habilitadas; los resultados se conocerán cuando se inhabiliten.
        </p>
        <p th:if="${!eleccionesTodaviaHabilitadas and presidenteGanador == null}" class="error">
            No se encuentra ningún presidente ganador todavía.
        </p>
        <p th:if="${!eleccionesTodaviaHabilitadas and presidenteGanador != null}" class="success"
           th:text="${presidenteGanador}">Nombre del presidente</p>

        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/panel}">
            <input type="submit" value="Volver al panel">
        </form>
        <form sec:authorize="hasRole('VOTANTE')" th:action="@{/usuario/panel}">
            <input type="submit" value="Volver al panel">
        </form>
    </div>
</body>
</html>

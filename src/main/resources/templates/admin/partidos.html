<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de partidos - Sistema de Votaciones</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/barra :: barraSuperior}"></div>
    <div class="container">
        <h1>Gestión de partidos</h1>
        <form th:action="@{/admin/partidos}" method="post" accept-charset="UTF-8">
            <label for="siglas">Siglas</label>
            <input id="siglas" name="siglas" type="text" placeholder="p. ej. PP" required>

            <label for="descripcion">Descripción</label>
            <input id="descripcion" name="descripcion" type="text" placeholder="Nombre completo del partido" required>

            <label for="imagen">Imagen (archivo dentro de /imagenes)</label>
            <input id="imagen" name="imagen" type="text" placeholder="partido.jpg" required>

            <input type="submit" value="Crear partido">
        </form>
        <hr class="separador">
        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/panel}">
            <input type="submit" value="Volver al panel">
        </form>
        <form sec:authorize="hasRole('ANALISTA')" th:action="@{/analista/panel}">
            <input type="submit" value="Volver al panel">
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - Sistema de Votaciones'">Censo</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/barra :: barraSuperior}"></div>
    <div class="container-ancho">
        <h1 th:text="${titulo}">Censo</h1>
        <div class="tabla-responsive">
            <table>
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Nombre completo</th>
                        <th>Fecha de nacimiento</th>
                        <th>Dirección</th>
                        <th>Localidad</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="persona : ${censo}">
                        <td th:text="${persona.dni}">DNI</td>
                        <td th:text="${persona.nombreCompleto}">Nombre</td>
                        <td th:text="${persona.fechaNacimiento}">Fecha</td>
                        <td th:text="${persona.direccion}">Dirección</td>
                        <td th:text="${persona.idLocalidad}">Localidad</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <form th:action="@{/admin/panel}">
            <input type="submit" value="Volver al panel">
        </form>
    </div>
</body>
</html>

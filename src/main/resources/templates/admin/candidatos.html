<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de candidatos - Sistema de Votaciones</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/barra :: barraSuperior}"></div>
    <div class="container">
        <h1>Gestión de candidatos</h1>
        <form th:action="@{/admin/candidatos}" method="post" accept-charset="UTF-8">
            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" maxlength="9" required>

            <label for="nombreCompleto">Nombre completo</label>
            <input type="text" id="nombreCompleto" name="nombreCompleto" required>

            <label for="siglasPartido">Siglas de su partido</label>
            <input type="text" id="siglasPartido" name="siglasPartido" required>

            <label for="orden">Orden en la candidatura</label>
            <input type="number" id="orden" name="orden" min="1" max="3" required>

            <input type="submit" value="Registrar candidato">
        </form>
        <hr class="separador">
        <form th:action="@{/admin/panel}">
            <input type="submit" value="Volver al panel">
        </form>
    </div>
</body>
</html>

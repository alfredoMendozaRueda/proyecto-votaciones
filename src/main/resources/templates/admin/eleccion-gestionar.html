<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestionar elecciones - Sistema de Votaciones</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/barra :: barraSuperior}"></div>
    <div class="container">
        <h1>Habilitar, deshabilitar o eliminar la elección</h1>
        <form th:action="@{/admin/elecciones/gestionar}" method="post">
            <label for="idEleccion">ID de la elección</label>
            <input type="text" id="idEleccion" name="idEleccion" placeholder="Escriba el id de elección" required>
            <div class="acciones">
                <button type="submit" name="accion" value="habilitar">Habilitar</button>
                <button type="submit" name="accion" value="deshabilitar">Deshabilitar</button>
                <button type="submit" name="accion" value="eliminar">Eliminar</button>
            </div>
        </form>
        <hr class="separador">
        <form th:action="@{/admin/panel}">
            <input type="submit" value="Volver al panel">
        </form>
    </div>
</body>
</html>
